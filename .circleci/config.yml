version: 2

jobs:
  test:
    docker:
      - image: cimg/python:3.12.14-node
    steps:
      - checkout
      - run:
          name: Enable corepack
          command: sudo corepack enable
      - run:
          name: Node version
          command: node --version
      - run:
          name: Install dependencies
          command: yarn
      - run:
          working_directory: hyperview
          name: Check types
          command: yarn test:ts
      - run:
          working_directory: hyperview
          name: Unit tests
          command: yarn test:unit
      - run:
          working_directory: hyperview
          name: Validate XML
          command: pip install xmlschema; yarn test:validate-xml
      - run:
          working_directory: hyperview
          name: Lint
          command: yarn test:lint
      - run:
          name: Docs
          command: yarn test:docs
      - run:
          working_directory: demo
          name: Demo - Check types
          command: yarn test:ts
      - run:
          working_directory: demo
          name: Demo - Lint
          command: pip install djhtml; yarn test:lint
      - run:
          working_directory: demo
          name: Demo - Validate XML
          command: pip install xmlschema; yarn test:validate-xml
  deploy:
    docker:
      - image: cimg/python:3.12.14-node
    steps:
      - add_ssh_keys:
          fingerprints:
            - 'SHA256:efIwcAYspXfEF3arKOxCPis7fOPJ1SRlYKCx7AC+HoE'
      - checkout
      - run:
          name: Enable corepack
          command: sudo corepack enable
      - run:
          name: Node version
          command: node --version
      - run:
          name: Install dependencies
          command: yarn
      - run:
          working_directory: demo
          name: Deploy
          command: |
            git config user.email "circleci@instawork.com"
            git config user.name "CircleCI"
            (yes || true) | yarn deploy
workflows:
  version: 2
  test-pr:
    jobs:
      - test
  deploy:
    jobs:
      - deploy:
          filters:
            branches:
              only:
                - master
